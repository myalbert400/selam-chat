<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሰላም ቻት (Selam Chat)</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --sent-bubble: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #f0f2f5;
            --sidebar-bg: #ffffff;
            --chat-bg: #f8f9fa;
            --text-main: #2d3748;
            --text-muted: #718096;
            --received-bubble: #ffffff;
            --border-color: #e2e8f0;
        }

        /* የተለያዩ የቀለም ምርጫዎች (Themes) */
        [data-theme="ocean"] {
            --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --primary-color: #0072ff;
            --sent-bubble: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }
        [data-theme="emerald"] {
            --primary-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --primary-color: #11998e;
            --sent-bubble: linear-gradient(135deg, #11998e 0%, #2bc96b 100%);
        }
        [data-theme="sunset"] {
            --primary-gradient: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
            --primary-color: #dd2476;
            --sent-bubble: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
        }
        [data-theme="dark"] {
            --primary-gradient: linear-gradient(135deg, #434343 0%, #000000 100%);
            --primary-color: #805ad5;
            --sent-bubble: linear-gradient(135deg, #6b46c1 0%, #805ad5 100%);
            --bg-color: #1a202c;
            --sidebar-bg: #2d3748;
            --chat-bg: #171923;
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --received-bubble: #2d3748;
            --border-color: #4a5568;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--primary-gradient);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        /* የመግቢያ እና ምዝገባ ሳጥን */
        .auth-container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: #2d3748;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }

        .switch-text span {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ዋናው የግል ቻት መስኮት (Private Chat App Layout) */
        #chat-app {
            display: none;
            width: 95%;
            max-width: 1050px;
            height: 88vh;
            background: var(--sidebar-bg);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        /* የግራ በኩል የተጠቃሚዎች ዝርዝር (Sidebar) */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: var(--primary-gradient);
            color: white;
        }

        .sidebar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-dots {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .dot:hover { transform: scale(1.2); }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            padding: 9px 12px;
            border-radius: 20px;
            background: var(--chat-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .user-item:hover, .user-item.active {
            background: rgba(102, 126, 234, 0.12);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .user-info {
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 12px;
            color: #38a169;
        }

        /* የቀኝ በኩል የውይይት ቦታ (Chat Area) */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }

        .chat-header {
            padding: 16px 22px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-muted);
        }

        .msg {
            max-width: 70%;
            padding: 11px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            word-wrap: break-word;
        }

        .msg.sent {
            align-self: flex-end;
            background: var(--sent-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            align-self: flex-start;
            background: var(--received-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .msg-time {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.75;
            text-align: right;
        }

        .chat-input {
            padding: 15px 20px;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .chat-input input {
            flex: 1;
            border-radius: 25px;
            padding: 12px 18px;
            background: var(--chat-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover { opacity: 0.9; }

        /* ለሞባይል ስክሪን ማስተካከያ */
        @media (max-width: 700px) {
            #chat-app { flex-direction: column; height: 95vh; }
            .sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .chat-main { height: 65%; }
        }
    </style>
</head>
<body>

    <!-- የመግቢያ እና ምዝገባ ገጽ -->
    <div class="auth-container" id="auth-container">
        <div class="logo-badge">💬</div>
        <h2 id="form-title">ሰላም ቻት - ግባ (Login)</h2>
        <div class="form-group">
            <label for="username">ኢሜል አድራሻ (Email)</label>
            <input type="email" id="username" placeholder="ምሳሌ፡ abebe@gmail.com">
        </div>
        <div class="form-group">
            <label for="password">ሚስጥር ቁጥር (Password)</label>
            <input type="password" id="password" placeholder="ሚስጥር ቁጥርዎን ያስገቡ">
        </div>
        <button class="btn-primary" id="auth-btn" onclick="handleAuth()">ግባ (Login)</button>
        <div class="switch-text" id="switch-text">
            አካውንት የለዎትም? <span onclick="toggleMode()">ይመዝገቡ (Register)</span>
        </div>
    </div>

    <!-- የግል ቻት መስኮት (Private Chat App) -->
    <div id="chat-app">
        <!-- ግራ ክፍል፡ የተጠቃሚዎች ዝርዝር -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <div>
                        <strong style="font-size: 17px;">ሰላም ቻት 💬</strong>
                        <div style="font-size: 12px; opacity: 0.9;" id="my-email"></div>
                    </div>
                </div>
                <!-- የቀለም መቀየሪያ አዝራሮች -->
                <div class="theme-dots" title="ቀለም ይቀይሩ">
                    <div class="dot" style="background: #667eea;" onclick="setTheme('default')"></div>
                    <div class="dot" style="background: #0072ff;" onclick="setTheme('ocean')"></div>
                    <div class="dot" style="background: #11998e;" onclick="setTheme('emerald')"></div>
                    <div class="dot" style="background: #dd2476;" onclick="setTheme('sunset')"></div>
                    <div class="dot" style="background: #1a202c;" onclick="setTheme('dark')"></div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="search-user" placeholder="🔍 ሰው ይፈልጉ..." onkeyup="filterUsers()">
            </div>

            <div class="users-list" id="users-list">
                <!-- የተመዘገቡ ሰዎች እዚህ ይዘረዘራሉ -->
            </div>
        </div>

        <!-- ቀኝ ክፍል፡ የግል ውይይት -->
        <div class="chat-main">
            <div class="chat-header">
                <div style="display: flex; align-items: center;">
                    <div class="avatar" id="chat-with-avatar" style="background: #667eea; display: none;">?</div>
                    <div>
                        <strong id="chat-with-name" style="font-size: 16px;">ውይይት ለመጀመር ሰው ይምረጡ</strong>
                        <div id="chat-with-sub" style="font-size: 12px; color: var(--text-muted);">ከግራ በኩል ካሉት ተጠቃሚዎች አንዱን ይጫኑ</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">ውጣ (Logout)</button>
            </div>

            <div class="messages-box" id="messages-container">
                <div class="empty-state">
                    <h3>🔒 የግል ውይይት (Private Chat)</h3>
                    <p>መልዕክት መላክ የሚችሉት ለመረጡት ሰው ብቻ ነው።</p>
                </div>
            </div>

            <div class="chat-input" id="input-area" style="display: none;">
                <input type="text" id="message-input" placeholder="የግል መልዕክት ይጻፉ..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">ላክ ➤</button>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let loggedInUser = localStorage.getItem('chat_user') || null;
        let selectedUser = null;
        let allUsers = [];
        let messageInterval = null;

        // ለአቫታር (Avatar) የተለያዩ ቀለማት
        const avatarColors = ['#e53e3e', '#dd6b20', '#38a169', '#3182ce', '#805ad5', '#d53f8c', '#319795'];

        function getAvatarColor(email) {
            let hash = 0;
            for (let i = 0; i < email.length; i++) {
                hash = email.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function setTheme(theme) {
            if (theme === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('chat_theme', theme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('chat_theme');
            if (savedTheme) setTheme(savedTheme);

            if (loggedInUser) {
                showChatApp();
            }
        };

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? "ሰላም ቻት - ግባ (Login)" : "ሰላም ቻት - ይመዝገቡ (Register)";
            document.getElementById('auth-btn').innerText = isLoginMode ? "ግባ (Login)" : "ተመዝገብ (Register)";
            document.getElementById('switch-text').innerHTML = isLoginMode 
                ? 'አካውንት የለዎትም? <span onclick="toggleMode()">ይመዝገቡ (Register)</span>'
                : 'አካውንት አለዎት? <span onclick="toggleMode()">ግባ (Login)</span>';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                alert('እባክዎ ኢሜል እና ሚስጥር ቁጥር ይሙሉ!');
                return;
            }

            if (!isLoginMode) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(username)) {
                    alert('እባክዎ ትክክለኛ የኢሜል አድራሻ ያስገቡ! (ምሳሌ፡ user@gmail.com)');
                    return;
                }
                if (password.length < 6) {
                    alert('ሚስጥር ቁጥሩ ቢያንስ 6 ፊደላት ወይም ቁጥሮች መሆን አለበት!');
                    return;
                }
            }

            const endpoint = isLoginMode ? '/login' : '/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (isLoginMode) {
                        loggedInUser = data.username;
                        localStorage.setItem('chat_user', loggedInUser);
                        showChatApp();
                    } else {
                        alert(data.message);
                        toggleMode();
                    }
                } else {
                    alert(data.error || 'ስህተት ተፈጥሯል');
                }
            } catch (err) {
                alert('ሰርቨሩ ጋር መገናኘት አልተቻለም!');
            }
        }

        function showChatApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('my-email').innerText = loggedInUser;
            loadUsers();
            setInterval(loadUsers, 5000); // አዲስ ሰው ሲመዘገብ ዝርዝሩን ያድሳል
        }

        async function loadUsers() {
            try {
                const response = await fetch(`/users?currentUser=${encodeURIComponent(loggedInUser)}`);
                allUsers = await response.json();
                renderUsers(allUsers);
            } catch (err) {
                console.error('ተጠቃሚዎችን ማምጣት አልተቻለም');
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('users-list');
            const searchTerm = document.getElementById('search-user').value.toLowerCase();
            list.innerHTML = '';

            const filtered = users.filter(u => u.username.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:gray; padding:20px; font-size:13px;">ምንም የተመዘገበ ሌላ ሰው አልተገኘም</p>';
                return;
            }

            filtered.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item' + (selectedUser === user.username ? ' active' : '');
                div.onclick = () => selectUser(user.username);

                const initial = user.username.charAt(0).toUpperCase();
                const color = getAvatarColor(user.username);

                div.innerHTML = `
                    <div class="avatar" style="background: ${color};">${initial}</div>
                    <div class="user-info">
                        <div class="user-name">${user.username}</div>
                        <div class="user-status">● የግል መልዕክት ይላኩ</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterUsers() {
            renderUsers(allUsers);
        }

        function selectUser(username) {
            selectedUser = username;
            renderUsers(allUsers);

            const avatar = document.getElementById('chat-with-avatar');
            avatar.style.display = 'flex';
            avatar.style.background = getAvatarColor(username);
            avatar.innerText = username.charAt(0).toUpperCase();

            document.getElementById('chat-with-name').innerText = username;
            document.getElementById('chat-with-sub').innerText = '🔒 የግል ውይይት (Private Chat)';
            document.getElementById('input-area').style.display = 'flex';

            loadMessages();
            if (messageInterval) clearInterval(messageInterval);
            messageInterval = setInterval(loadMessages, 2000);
        }

        async function loadMessages() {
            if (!selectedUser) return;
            try {
                const response = await fetch(`/messages?user1=${encodeURIComponent(loggedInUser)}&user2=${encodeURIComponent(selectedUser)}`);
                const messages = await response.json();
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                if (messages.length === 0) {
                    container.innerHTML = `<div class="empty-state"><p>ከ <b>${selectedUser}</b> ጋር የመጀመሪያውን ሰላምታ ይላኩ! 👋</p></div>`;
                    return;
                }

                messages.forEach(msg => {
                    const div = document.createElement('div');
                    const isMine = msg.sender === loggedInUser;
                    div.className = 'msg ' + (isMine ? 'sent' : 'received');
                    
                    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    div.innerHTML = `${msg.message} <span class="msg-time">${time}</span>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error('መልዕክቶችን ማምጣት አልተቻለም');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || !selectedUser) return;

            input.value = '';
            await fetch('/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender: loggedInUser,
                    receiver: selectedUser,
                    message: message
                })
            });
            loadMessages();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function logout() {
            localStorage.removeItem('chat_user');
            location.reload();
        }
    </script>
</body>
</html>
